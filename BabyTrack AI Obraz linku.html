<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>BabyTrack AI — Obraz podglądu linku</title>
<!-- Obraz pokazywany przy udostępnianiu linku (Facebook, Messenger, WhatsApp, LinkedIn): 1200 × 630 px.
     Wynik zapisz jako assets/og-image.png (headless Chrome z --window-size=1200,630 --screenshot). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#fffdf9;--ink:#000000;--sky:#e2ead9;--sky-deep:#8fa87d;--tint:#f7eddc;--peach:#f9e2d5;
  --display:"Fraunces",Georgia,serif;--sans:"DM Sans",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--paper)}
.card{
  width:1200px;height:630px;overflow:hidden;
  font-family:var(--sans);color:var(--ink);
  background:linear-gradient(135deg,var(--sky) 0%,var(--tint) 45%,var(--paper) 80%);
  padding:56px 64px;display:flex;gap:56px;align-items:center;
}
.text{flex:1}
.eyebrow{font-size:20px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;margin:0 0 18px}
.brand{font-family:var(--display);font-weight:500;font-size:40px;letter-spacing:-.02em;line-height:1;margin:0 0 30px}
.brand em{font-style:italic}
h1{font-family:var(--display);font-weight:500;font-size:64px;line-height:1;letter-spacing:-.03em;margin:0 0 24px}
h1 em{font-style:italic}
.lede{font-size:26px;line-height:1.35;margin:0 0 30px}
.pill{display:inline-flex;align-items:center;gap:12px;background:var(--peach);border:3px solid var(--ink);border-radius:99px;padding:10px 22px;font-size:22px;font-weight:700}
.pill i{width:11px;height:11px;border-radius:50%;background:var(--ink);display:block}
.logo{width:380px;height:380px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:inset 0 0 0 5px var(--sky-deep);flex:none;overflow:hidden}
.logo img{width:88%;height:88%;object-fit:contain}
</style>
</head>
<body>
<div class="card">
  <div class="text">
    <p class="eyebrow">Projekt naukowo-badawczy · UKW · UMP</p>
    <p class="brand">BabyTrack <em>AI</em></p>
    <h1>Bezpłatne badanie rozwoju ruchowego niemowląt <em>2–3 mies.</em></h1>
    <p class="lede">Bydgoszcz · dwie wizyty · bez kontaktu z dzieckiem</p>
    <span class="pill"><i></i> Rekrutacja trwa do grudnia 2026</span>
  </div>
  <span class="logo"><img src="assets/babytrack-logo.png" alt=""></span>
</div>
</body>
</html>
